name: Render briefing pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pulse.json
      - briefing.json
      - docs/pulse.json
      - docs/briefing.json
      - scripts/render-pages.mjs

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render pages
        run: node scripts/render-pages.mjs

      - name: Commit rendered pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/briefing docs/en/briefing docs/index.html docs/en/index.html docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "No rendered changes"
          else
            git commit -m "Render briefing and pulse pages from the feeds"
            git push
          fi
